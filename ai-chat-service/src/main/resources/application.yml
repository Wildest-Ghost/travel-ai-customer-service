server:
  port: 8084

spring:
  application:
    name: ai-chat-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/agent
    username: agent
    password: agent123
  data:
    redis:
      host: localhost
      port: 6379
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      chat:
        options:
          model: qwen-max
          temperature: 0.3
      embedding:
        options:
          model: text-embedding-v3
    vectorstore:
      pgvector:
        index-type: HNSW              # 高性能索引（备选 IVFFLAT）
        distance-type: COSINE_DISTANCE
        dimensions: 1024               # text-embedding-v3 是 1024 维
        initialize-schema: true        # 启动时自动建 vector_store 表
        schema-name: public
        table-name: vector_store